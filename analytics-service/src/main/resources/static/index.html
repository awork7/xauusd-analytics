<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XAUUSD Live Analytics</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #121214; color: #e2e8f0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #2d3748; padding-bottom: 10px; }
        .status { background-color: #38a169; color: white; padding: 5px 12px; border-radius: 12px; font-weight: bold; }
        .card { background-color: #1a202c; padding: 20px; border-radius: 8px; border: 1px solid #2d3748; margin-top: 20px; }
        .price { font-size: 40px; font-weight: bold; color: #ecc94b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥇 XAUUSD Live Analytics Dashboard</h1>
            <span class="status">Connected</span>
        </div>
        <div class="card">
            <h3>Live Gold Price (Spot)</h3>
            <div class="price">$2,345.20</div>
            <p>System Online. Data streaming via Kafka pipeline on port 9094.</p>
        </div>
    </div>
</body>
</html>
