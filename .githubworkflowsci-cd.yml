name: XAUUSD Analytics Consumer CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build and Test with Maven
      run: mvn clean package -f analytics-consumer/pom.xml

    # Optional: Build Docker Image once code passes tests
    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build Local Container Image
      run: |
        docker build -t xauusd-analytics-consumer:latest ./analytics-consumer